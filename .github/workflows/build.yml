name: Build APK
on:
  push: {branches: [main]}
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: Init Android scaffold
        run: flutter create --org com.kugou --project-name kugou --platforms=android .
      - name: Override manifest
        run: cp android_manifest.xml android/app/src/main/AndroidManifest.xml
      - name: Deps
        run: flutter pub get
      - name: Build
        id: b
        continue-on-error: true
        run: flutter build apk --release --split-per-abi 2>&1 | tee /tmp/build.log
      - name: Upload error log
        if: steps.b.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with: {name: build-error-log, path: /tmp/build.log}
      - name: Fail
        if: steps.b.outcome == 'failure'
        run: exit 1
      - name: Rename
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/kugou-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/kugou-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/kugou-x64.apk
      - uses: actions/upload-artifact@v4
        with: {name: kugou-apks, path: out/*.apk}
