name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      - run: flutter create --org com.kugou --project-name kugou --platforms=android .
      - run: |
          [ -f android_manifest.xml ] && cp android_manifest.xml android/app/src/main/AndroidManifest.xml || true
      - run: flutter pub get
      - run: flutter build apk --release 2>&1 | tee /tmp/build.log
      - name: Find APK
        run: |
          mkdir -p out
          cp $(find build/app/outputs/flutter-apk -name "*.apk" | head -1) out/KuGou.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: out/KuGou.apk
          make_latest: true
