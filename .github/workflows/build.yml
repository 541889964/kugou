name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      - run: flutter create --org com.kugou --project-name kugou --platforms=android .
      - run: cp android_manifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Build
        id: b
        continue-on-error: true
        run: flutter build apk --release 2>&1 | tee /tmp/build.log
      - if: steps.b.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with: { name: build-error-log, path: /tmp/build.log }
      - if: steps.b.outcome == 'failure'
        run: exit 1
      - run: |
          mkdir -p out
          APK=$(find build/app/outputs/flutter-apk -maxdepth 1 -name "*.apk" -type f | head -1)
          cp "$APK" out/KuGou.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KuGou #${{ github.run_number }}
          files: out/KuGou.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
